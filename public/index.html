<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张维维贴身顾问 · 帮你理解问题、梳理思路、制定行动的 AI 顾问</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">张维维贴身顾问</div>
    <nav class="home-nav">
      <a href="/about">关于我们</a>
      <a href="/compare">和传统AI对比</a>
      <a href="/scenarios">使用场景</a>
      <a href="/faq">FAQ</a>
      <a href="/community">社区</a>
    </nav>
  </header>

  <main class="stage">
    <!-- Hero 区：第一眼告诉用户这是干什么的 -->
    <section id="hero" class="hero">
      <p class="home-tagline">一款帮你理解真实问题、梳理思路并制定下一步行动的 AI 顾问</p>
      <h1>今天有什么想了解的呢？</h1>
      <p class="lede">
        我不会急着给你答案。<br>
        先把你的目标说清楚，剩下的一步一步来。
      </p>
      <p class="examples">
        <span class="examples-label">试试这样问：</span>
        <span class="example">我想做自媒体赚钱，但不知道从哪开始</span>
        <span class="example">我想转行做产品经理</span>
        <span class="example">我最近睡不好，怎么办</span>
        <span class="example">我想半年内把英语练到能交流</span>
      </p>
    </section>

    <div id="log" class="log"></div>

    <div id="planActions" class="plan-actions hidden">
      <button id="btnSubmitAnalysis" class="primary hidden">📤 提交分析</button>
      <button id="btnPlan" class="primary hidden">📋 生成分析</button>
      <button id="btnExecute" class="primary hidden">① 继续深入这个问题</button>
      <button id="btnActionPlan" class="primary hidden">② 帮你拆解成行动计划</button>
      <button id="btnNewTopic" class="ghost hidden">③ 换个新问题</button>
      <button id="btnFinish" class="ghost hidden">✓ 完成导航</button>
    </div>

    <div id="feedbackBox" class="feedback hidden">
      <span>这次导航有用吗？</span>
      <span id="stars" class="stars">
        <span data-score="1">★</span><span data-score="2">★</span><span data-score="3">★</span>
        <span data-score="4">★</span><span data-score="5">★</span>
      </span>
    </div>
  </main>

  <footer class="composer">
    <div id="loading" class="loading hidden">
      <span class="spinner"></span>
      <span class="loading-text">🧭 顾问正在为您深度分析中，请稍候…</span>
    </div>
    <div class="row">
      <textarea id="input" rows="2" placeholder="描述你想完成的任务，或卡住的那一步…"></textarea>
      <button id="btnSend" class="primary">发送</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
