# /etc/nginx/sites-available/guwenai.cn
# 用途：guwenai.cn 的入口。HTTPS 强制 + 反代到本地 node:3000
# 应用：sudo ln -s /etc/nginx/sites-available/guwenai.cn /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

# ① HTTP：所有访问都强制跳到 HTTPS（解决"证书装了但还显示不安全"——你之前直访 guwenai.cn 是 http）
server {
    listen 80;
    listen [::]:80;
    server_name guwenai.cn www.guwenai.cn;
    return 301 https://$host$request_uri;
}

# ② HTTPS：证书路径（certbot --nginx 已自动写入；如果你手动配，请按你实际路径）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guwenai.cn www.guwenai.cn;

    ssl_certificate     /etc/letsencrypt/live/guwenai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guwenai.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全头（可省略）
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # 上传大小限制（防止默认 1m 太小）
    client_max_body_size 10m;

    # ---- API 反代（关键修复：之前你发送没反应就是这个 location 缺失）----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 静态/前端入口（全部交由 node:3000 的 express 静态服务）----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
